[build]
  publish = "output/web"
  command = "node --test tests/counseling-*.test.cjs"

[build.environment]
  NODE_VERSION = "22"

[[plugins]]
  package = "./plugins/counseling-verify"

[[headers]]
  for = "/counseling/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Content-Type-Options = "nosniff"

[functions]
  directory = "netlify/functions"

# The runtime SDK is a checked-in self-contained CJS bundle with provenance.
# Include the local file explicitly; no runtime npm resolution is required.
[functions."counseling-*"]
  node_bundler = "esbuild"
  included_files = ["netlify/functions/_lib/vendor/netlify-blobs.cjs"]

[functions."admin-update"]
  node_bundler = "esbuild"
  included_files = ["netlify/functions/_lib/vendor/netlify-blobs.cjs"]

# 백워드 수업 설계(/backward/) API 프록시 — Cloud Run 백워드 엔드포인트로 리라이트.
# 브라우저는 동일 오리진(daeryun.life/bw-api/*)으로 호출 → CORS 불필요, 원본 서버 무수정.
[[redirects]]
  from = "/bw-api/*"
  to = "https://service-63986215827.us-west1.run.app/api/backward/:splat"
  status = 200
  force = true

# 수행평가 구현 미리보기(/sdg/) 학생용 기능. 생성은 교사 PC 처리 프로그램이 맡는다.
[[redirects]]
  from = "/sdg-api/*"
  to = "/.netlify/functions/sdg/:splat"
  status = 200
  force = true

[[headers]]
  for = "/sdg/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; worker-src 'self' blob:; frame-src 'self'; connect-src 'self' https://*.supabase.co; frame-ancestors 'self'; base-uri 'none'; form-action 'none'"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"

# HTML 문서를 항상 브라우저에 표시 (다운로드 방지)
[[headers]]
  for = "/"
  [headers.values]
    Content-Type = "text/html; charset=UTF-8"
    Content-Disposition = "inline"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/index.html"
  [headers.values]
    Content-Type = "text/html; charset=UTF-8"
    Content-Disposition = "inline"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/*.html"
  [headers.values]
    Content-Type = "text/html; charset=UTF-8"
    Content-Disposition = "inline"

# OG 미리보기 이미지
[[headers]]
  for = "/logo.jpg"
  [headers.values]
    Content-Type = "image/jpeg"
    Content-Disposition = "inline"
