[build]
  publish = "output/web"
  command = "node --test tests/counseling-*.test.cjs tests/auth-gate.test.cjs && node scripts/build_auth_gate.cjs output/web --in-place"

[build.environment]
  NODE_VERSION = "22"

[[plugins]]
  package = "./plugins/counseling-verify"

[[headers]]
  for = "/counseling/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Content-Type-Options = "nosniff"

# 로그인 게이트: 정적 파일 앞에서 서버가 쿠키를 검사한다. 대소문자 변형 우회를 막으려고
# 전체 경로에 걸고, 명백한 공개 폴더만 제외한다. 보호 목록은 auth-gate.js의 requiredTier.
[[edge_functions]]
  function = "auth-gate"
  path = "/*"
  excludedPath = ["/.netlify/*", "/lib/*", "/img/*", "/pdf/*", "/biotech/*", "/assessment/*", "/counseling/*", "/sdg/*", "/sdg-api/*", "/downloads/*", "/data/univ/*", "/auth-gate-client.js", "/favicon.ico", "/logo.jpg", "/logo.png", "/og-image-v2.jpg"]

# 전략실은 자체 서버 인증을 쓰므로 화면은 두되 검색 색인만 막는다.
[[headers]]
  for = "/counseling/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[functions]
  directory = "netlify/functions"

# The runtime SDK is a checked-in self-contained CJS bundle with provenance.
# Include the local file explicitly; no runtime npm resolution is required.
[functions."counseling-*"]
  node_bundler = "esbuild"
  included_files = ["netlify/functions/_lib/vendor/netlify-blobs.cjs"]

[functions."admin-update"]
  node_bundler = "esbuild"
  included_files = ["netlify/functions/_lib/vendor/netlify-blobs.cjs"]

# 백워드 수업 설계(/backward/) API 프록시 — Cloud Run 직접 호출이 fetch 예외로 실패할 때만 쓴다.
# 프록시는 대기 한도(약 26초)에 끊길 수 있어 기본 경로로 쓰지 않는다.
[[redirects]]
  from = "/bw-api/*"
  to = "https://service-63986215827.us-west1.run.app/api/backward/:splat"
  status = 200
  force = true

# 수행평가 구현 미리보기(/sdg/) 학생용 기능. 생성은 교사 PC 처리 프로그램이 맡는다.
[[redirects]]
  from = "/sdg-api/*"
  to = "/.netlify/functions/sdg/:splat"
  status = 200
  force = true

[[headers]]
  for = "/sdg/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; worker-src 'self' blob:; frame-src 'self'; connect-src 'self' https://*.supabase.co; frame-ancestors 'self'; base-uri 'none'; form-action 'none'"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"

# HTML 문서를 항상 브라우저에 표시 (다운로드 방지)
[[headers]]
  for = "/"
  [headers.values]
    Content-Type = "text/html; charset=UTF-8"
    Content-Disposition = "inline"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/index.html"
  [headers.values]
    Content-Type = "text/html; charset=UTF-8"
    Content-Disposition = "inline"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/*.html"
  [headers.values]
    Content-Type = "text/html; charset=UTF-8"
    Content-Disposition = "inline"

# OG 미리보기 이미지
[[headers]]
  for = "/logo.jpg"
  [headers.values]
    Content-Type = "image/jpeg"
    Content-Disposition = "inline"
