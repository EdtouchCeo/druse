<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>수행평가 점수 조회</title>
    <!-- 자체 호스팅 라이브러리 (외부 CDN 의존 없음 — 학교 네트워크 차단에도 동작) -->
    <script src="lib/tailwind.js"></script>
    <script src="lib/react.production.min.js"></script>
    <script src="lib/react-dom.production.min.js"></script>
    <script src="lib/xlsx.full.min.js"></script>
    <style>
        .animate-spin { animation: spin 1s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .animate-pulse { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .5; } }
        .animate-bounce { animation: bounce 1s infinite; }
        @keyframes bounce {
            0%, 100% { transform: translateY(-25%); animation-timing-function: cubic-bezier(0.8,0,1,1); }
            50% { transform: none; animation-timing-function: cubic-bezier(0,0,0.2,1); }
        }
    </style>
</head>
<body>
    <div id="root" style="font-family:system-ui,-apple-system,'Malgun Gothic',sans-serif;color:#6b7280;text-align:center;padding:40px;">불러오는 중…</div>
    <!-- JSX를 미리 컴파일한 앱 (Babel 불필요) -->
    <script src="lib/score_app.js"></script>
</body>
</html>
